<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design Kit</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #fafaf8;
    --line: #e2e0da;
    --mono: "SF Mono", "IBM Plex Mono", Menlo, monospace;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 24px 96px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
  }

  header {
    max-width: 960px;
    margin: 0 auto 48px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .meta {
    font-family: var(--mono);
    font-size: 12px;
    color: #767470;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
  }

  section {
    margin-bottom: 56px;
  }

  section h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #767470;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }

  .card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }

  .swatch {
    height: 72px;
  }

  .card-body {
    padding: 10px 12px;
  }

  .card-name {
    font-size: 13px;
    font-weight: 500;
    margin: 0 0 2px;
    word-break: break-word;
  }

  .card-value {
    font-family: var(--mono);
    font-size: 11px;
    color: #767470;
  }

  .text-sample {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    padding: 20px;
    margin-bottom: 12px;
  }

  .text-sample .label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: #767470;
    margin-bottom: 10px;
  }

  .effect-sample {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 12px;
  }

  .effect-box {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    background: #fff;
    flex-shrink: 0;
  }

  .effect-info .name {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .effect-info .value {
    font-family: var(--mono);
    font-size: 11px;
    color: #767470;
  }

  .empty {
    font-family: var(--mono);
    font-size: 13px;
    color: #999;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <h1>Design Tokens</h1>
  <div class="meta" id="meta">Loading&hellip;</div>
</header>

<main id="main"></main>

<div class="toast" id="toast">Copied</div>

<script>
  const TOKENS_PATH = "tokens/figma-tokens.json";

  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1200);
  }

  function copy(text) {
    navigator.clipboard.writeText(text).then(() => showToast("Copied " + text));
  }

  function renderColors(colors) {
    const entries = Object.entries(colors || {});
    if (entries.length === 0) return '<p class="empty">No color styles found.</p>';

    return '<div class="grid">' + entries.map(([name, token]) => {
      const value = typeof token.value === "string" ? token.value : "?";
      return `
        <div class="card" onclick="copy('${value}')">
          <div class="swatch" style="background:${value}"></div>
          <div class="card-body">
            <p class="card-name">${name}</p>
            <p class="card-value">${value}</p>
          </div>
        </div>
      `;
    }).join("") + '</div>';
  }

  function renderText(textStyles) {
    const entries = Object.entries(textStyles || {});
    if (entries.length === 0) return '<p class="empty">No text styles found.</p>';

    return entries.map(([name, token]) => {
      const v = token.value || {};
      const family = v.fontFamily || "inherit";
      const size = v.fontSize ? v.fontSize + "px" : "16px";
      const weight = v.fontWeight || 400;
      return `
        <div class="text-sample">
          <div class="label">
            <span>${name}</span>
            <span>${family} &middot; ${weight} &middot; ${size}</span>
          </div>
          <div style="font-family:'${family}', sans-serif; font-size:${size}; font-weight:${weight};">
            The quick brown fox jumps over the lazy dog
          </div>
        </div>
      `;
    }).join("");
  }

  function renderEffects(effects) {
    const entries = Object.entries(effects || {});
    if (entries.length === 0) return '<p class="empty">No effect styles found.</p>';

    return entries.map(([name, token]) => {
      const list = Array.isArray(token.value) ? token.value : [];
      const shadow = list.map(e => {
        const offset = e.offset || { x: 0, y: 0 };
        const color = e.color || "rgba(0,0,0,0.25)";
        return `${offset.x}px ${offset.y}px ${e.radius || 0}px ${color}`;
      }).join(", ");
      const summary = list.map(e => e.type).join(", ") || "none";

      return `
        <div class="effect-sample">
          <div class="effect-box" style="box-shadow:${shadow || "none"}"></div>
          <div class="effect-info">
            <div class="name">${name}</div>
            <div class="value">${summary}</div>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderGrids(grids) {
    const entries = Object.entries(grids || {});
    if (entries.length === 0) return '<p class="empty">No grid styles found.</p>';

    return entries.map(([name, token]) => `
      <div class="text-sample">
        <div class="label"><span>${name}</span></div>
        <pre class="card-value" style="margin:0;">${JSON.stringify(token.value, null, 2)}</pre>
      </div>
    `).join("");
  }

  fetch(TOKENS_PATH)
    .then(res => {
      if (!res.ok) throw new Error("Could not load " + TOKENS_PATH);
      return res.json();
    })
    .then(data => {
      const meta = data._meta || {};
      document.getElementById("meta").textContent =
        `Last synced ${meta.fetchedAt ? new Date(meta.fetchedAt).toLocaleString() : "unknown"}`;

      const main = document.getElementById("main");
      main.innerHTML = `
        <section>
          <h2>Colors</h2>
          ${renderColors(data.fill)}
        </section>
        <section>
          <h2>Typography</h2>
          ${renderText(data.text)}
        </section>
        <section>
          <h2>Effects</h2>
          ${renderEffects(data.effect)}
        </section>
        <section>
          <h2>Layout Grids</h2>
          ${renderGrids(data.grid)}
        </section>
      `;
    })
    .catch(err => {
      document.getElementById("meta").textContent = "Error loading tokens";
      document.getElementById("main").innerHTML =
        `<p class="empty">${err.message}. Make sure you're viewing this through a local server, not opening the file directly.</p>`;
    });
</script>

</body>
</html>
