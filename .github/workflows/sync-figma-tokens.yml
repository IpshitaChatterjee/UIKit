name: Sync Figma Tokens

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install style-dictionary --no-save

      - name: Fetch tokens from Figma
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node scripts/fetch-figma-tokens.js

      - name: Build CSS and JS from tokens
        run: npx style-dictionary build --config style-dictionary.config.js

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync design tokens from Figma"
          title: "Sync design tokens from Figma"
          body: "Auto-generated by the Sync Figma Tokens workflow. Review the diff in tokens/ and build/ before merging."
          branch: figma-token-sync
          add-paths: |
            tokens/figma-tokens.json
            build/
